name: Sincronizar documentos Mercado Central 24h

on:
  schedule:
    # Todos los días a las 06:00 UTC. Ajustar según necesidad (semanal, etc.)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mercado_central_rag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar sincronización
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
        run: python scripts/ingest.py

      # El manifiesto (data/manifest.json) es lo que permite saber, en la
      # próxima corrida, qué archivos ya están indexados y evitar reprocesar
      # todo el corpus. Como los runners de GitHub Actions son efímeros, hay
      # que confirmar (commit) el manifiesto actualizado de vuelta al repo.
      - name: Guardar manifiesto actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git diff --staged --quiet || git commit -m "chore: actualizar manifiesto de sincronización"
          git push
